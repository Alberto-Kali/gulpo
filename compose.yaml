services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gulpo
      POSTGRES_USER: gulpo
      POSTGRES_PASSWORD: gulpo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  panel-api:
    build:
      context: .
      dockerfile: infra/panel-api.Dockerfile
    environment:
      PANEL_HTTP_ADDR: ":8080"
      PANEL_DATABASE_URL: "postgres://gulpo:gulpo@postgres:5432/gulpo?sslmode=disable"
      PANEL_ADMIN_EMAIL: "admin@example.com"
      PANEL_ADMIN_PASSWORD: "change-me"
      PANEL_JWT_SECRET: "dev-secret"
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  panel-web:
    build:
      context: .
      dockerfile: infra/panel-web.Dockerfile
    environment:
      NEXT_PUBLIC_PANEL_API_BASE_URL: "http://localhost:8080"
    depends_on:
      - panel-api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
