version: "3.3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gulpo
      POSTGRES_USER: gulpo
      POSTGRES_PASSWORD: gulpo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  panel-api:
    build:
      context: .
      dockerfile: infra/panel-api.Dockerfile
    restart: unless-stopped
    environment:
      PANEL_HTTP_ADDR: ":8080"
      PANEL_DATABASE_URL: "postgres://gulpo:gulpo@postgres:5432/gulpo?sslmode=disable"
      PANEL_ADMIN_LOGIN: "axalotctl"
      PANEL_ADMIN_EMAIL: "axalotctl@local"
      PANEL_ADMIN_PASSWORD: "Mars.Bmas.Bias.0"
      PANEL_JWT_SECRET: "dev-secret"
      PANEL_SS_SECRET_KEY: "dev-ss-secret"
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  panel-web:
    build:
      context: .
      dockerfile: infra/panel-web.Dockerfile
    restart: unless-stopped
    environment:
      PANEL_API_INTERNAL_BASE_URL: "http://panel-api:8080"
    depends_on:
      - panel-api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
