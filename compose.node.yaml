version: "3.3"

services:
  test-node:
    build:
      context: .
      dockerfile: infra/node-agent.Dockerfile
    container_name: gulpo_test_node
    restart: unless-stopped
    environment:
      NODE_PANEL_BASE_URL: "http://78.17.36.187:8080"
      NODE_ENROLL_TOKEN: "CHANGE_ME_ENROLL_TOKEN"
      NODE_AGENT_VERSION: "0.1.0"
      NODE_SINGBOX_VERSION: "1.13.5"
      NODE_STATE_DIR: "/var/lib/gulpo-node"
      NODE_POLL_INTERVAL: "30s"
      NODE_HEARTBEAT_EVERY: "15s"
      NODE_TELEMETRY_EVERY: "20s"
      NODE_V2RAY_API_LISTEN: "127.0.0.1:11085"
      NODE_CLASH_API_URL: "http://127.0.0.1:19090"
    ports:
      - "80:80"
      - "443:443"
      - "2080:2080"
      - "8443:8443"
      - "9443:9443"
      - "8444:8444/udp"
      - "8445:8445/udp"
    volumes:
      - test-node-state:/var/lib/gulpo-node

volumes:
  test-node-state:
