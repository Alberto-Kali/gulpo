services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - deploy/env/panel.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - panel-internal

  panel-api:
    image: ${PANEL_API_IMAGE}
    restart: unless-stopped
    env_file:
      - deploy/env/panel.env
    environment:
      PANEL_HTTP_ADDR: ":8080"
      PANEL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PANEL_ADMIN_LOGIN: ${PANEL_ADMIN_LOGIN}
      PANEL_ADMIN_EMAIL: ${PANEL_ADMIN_EMAIL}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD}
      PANEL_JWT_SECRET: ${PANEL_JWT_SECRET}
      PANEL_SS_SECRET_KEY: ${PANEL_SS_SECRET_KEY}
      PANEL_NODE_OFFLINE_TIMEOUT: ${PANEL_NODE_OFFLINE_TIMEOUT}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - panel-internal

  panel-web:
    image: ${PANEL_WEB_IMAGE}
    restart: unless-stopped
    env_file:
      - deploy/env/panel.env
    environment:
      PANEL_API_INTERNAL_BASE_URL: http://panel-api:8080
      NEXT_PUBLIC_PANEL_BASE_PATH: ${NEXT_PUBLIC_PANEL_BASE_PATH}
    depends_on:
      - panel-api
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - panel-internal

volumes:
  postgres-data:

networks:
  panel-internal:
